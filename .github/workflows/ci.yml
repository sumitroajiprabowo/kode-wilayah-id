name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage to Codecov
        if: matrix.node-version == 22
        uses: codecov/codecov-action@v5
        with:
          directory: coverage/
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage artifact
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify dist output
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/types.js
          test -f dist/types.cjs
          test -f dist/types.d.ts
          test -f dist/provinces.js
          test -f dist/provinces.cjs
          test -f dist/provinces.d.ts
          test -f dist/regencies.js
          test -f dist/regencies.cjs
          test -f dist/regencies.d.ts
          test -f dist/districts.js
          test -f dist/districts.cjs
          test -f dist/districts.d.ts
          test -f dist/villages.js
          test -f dist/villages.cjs
          test -f dist/villages.d.ts
          test -f dist/search.js
          test -f dist/search.cjs
          test -f dist/search.d.ts
          test -f dist/hierarchy.js
          test -f dist/hierarchy.cjs
          test -f dist/hierarchy.d.ts
          test -f dist/stats.js
          test -f dist/stats.cjs
          test -f dist/stats.d.ts
          echo "All expected dist files exist (9 entry points × 3 formats = 27 files)"
      - name: Test CJS import
        run: node -e "const p = require('./dist/provinces.cjs'); console.log('CJS OK:', p.getProvinces().length, 'provinces'); const v = p.getProvinces()[0]; if(!v.bps_code) throw new Error('Missing bps_code')"
      - name: Test ESM import
        run: node --input-type=module -e "import { getProvinces } from './dist/provinces.js'; console.log('ESM OK:', getProvinces().length, 'provinces'); const v = getProvinces()[0]; if(!v.bps_code) throw new Error('Missing bps_code')"

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
